# Reusable: build Docker + push no Artifact Registry via WIF (sem chave JSON).
# Saída image-uri sempre com digest — nunca :latest em deploy.
name: build-and-push

on:
  workflow_call:
    inputs:
      image-name:
        description: Nome da imagem (ex, cm-identity)
        type: string
        required: true
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: "."
      gcp-region:
        type: string
        required: true
      gcp-project-id:
        type: string
        required: true
      artifact-repository:
        description: repository_id do Artifact Registry
        type: string
        required: true
      workload-identity-provider:
        description: Resource name completo do WIF provider
        type: string
        required: true
      deploy-service-account:
        description: Email da SA de deploy federada
        type: string
        required: true
    secrets:
      CM_SDK_DEPLOY_KEY:
        description: >
          Chave privada SSH (ed25519) da deploy key somente-leitura cadastrada em
          cm-tech-ventures/cm-sdk. Opcional: só necessário quando requirements.txt
          do core depende de cm-sdk via git URL. Injetada no build via BuildKit SSH
          mount (nunca fica em layer da imagem); o Dockerfile deve montá-la com
          `--mount=type=ssh`.
        required: false
    outputs:
      image-uri:
        description: URI da imagem com digest
        value: ${{ jobs.build.outputs.image-uri }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.deploy-service-account }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.gcp-region }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start ssh-agent (para RUN --mount=type=ssh no build)
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"

      - name: Carregar deploy key do cm-sdk no agent (se fornecida)
        env:
          CM_SDK_DEPLOY_KEY: ${{ secrets.CM_SDK_DEPLOY_KEY }}
        run: |
          if [ -z "$CM_SDK_DEPLOY_KEY" ]; then
            exit 0
          fi
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$CM_SDK_DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-add "$KEY_FILE"
          rm -f "$KEY_FILE"

      - name: Set image tag
        id: vars
        run: |
          REPO="${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.artifact-repository }}/${{ inputs.image-name }}"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.vars.outputs.tag }}
          ssh: default
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolver digest
        id: push
        run: |
          DIGEST="${{ steps.vars.outputs.repo }}@${{ steps.build.outputs.digest }}"
          echo "image-uri=${DIGEST}" >> "$GITHUB_OUTPUT"

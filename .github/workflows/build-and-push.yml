# Reusable: build Docker + push no Artifact Registry via WIF (sem chave JSON).
# Saída image-uri sempre com digest — nunca :latest em deploy.
name: build-and-push

on:
  workflow_call:
    inputs:
      image-name:
        description: Nome da imagem (ex, cm-identity)
        type: string
        required: true
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: "."
      gcp-region:
        type: string
        required: true
      gcp-project-id:
        type: string
        required: true
      artifact-repository:
        description: repository_id do Artifact Registry
        type: string
        required: true
      workload-identity-provider:
        description: Resource name completo do WIF provider
        type: string
        required: true
      deploy-service-account:
        description: Email da SA de deploy federada
        type: string
        required: true
    secrets:
      cm-sdk-read-token:
        description: >
          Token de leitura (fine-grained PAT ou GitHub App installation token) com
          acesso ao repo privado cm-tech-ventures/cm-sdk. Opcional: só necessário
          quando requirements.txt do core depende de cm-sdk via git URL. Injetado
          no build via BuildKit secret (nunca fica em layer da imagem); o
          Dockerfile deve montá-lo com `--mount=type=secret,id=cm_sdk_read_token`.
        required: false
    outputs:
      image-uri:
        description: URI da imagem com digest
        value: ${{ jobs.build.outputs.image-uri }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.deploy-service-account }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.gcp-region }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        env:
          CM_SDK_READ_TOKEN: ${{ secrets.cm-sdk-read-token }}
        run: |
          REPO="${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.artifact-repository }}/${{ inputs.image-name }}"
          TAG="${REPO}:${GITHUB_SHA}"
          docker buildx build \
            --secret id=cm_sdk_read_token,env=CM_SDK_READ_TOKEN \
            --load \
            -f "${{ inputs.dockerfile }}" -t "$TAG" "${{ inputs.context }}"
          docker push "$TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$TAG")
          echo "image-uri=${DIGEST}" >> "$GITHUB_OUTPUT"

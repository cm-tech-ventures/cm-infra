# Reusable: terraform apply do core (main.tf fino instanciando módulos do cm-infra).
# State por serviço em bucket GCS: prefix = <service>/<environment>.
name: deploy-cloud-run

on:
  workflow_call:
    inputs:
      service:
        description: Nome do serviço/core (ex, cm-identity)
        type: string
        required: true
      image-uri:
        description: URI da imagem com digest (saída do build-and-push)
        type: string
        required: true
      environment:
        type: string
        default: "prod"
      terraform-dir:
        description: Diretório com o main.tf do core
        type: string
        default: "infra"
      terraform-version:
        type: string
        default: "1.9.8"
      state-bucket:
        description: Bucket GCS do state do Terraform
        type: string
        required: true
      workload-identity-provider:
        type: string
        required: true
      deploy-service-account:
        type: string
        required: true
      identity-introspection-url:
        description: URL do endpoint de introspeção do cm-identity (obrigatório para cores que usam autenticação)
        type: string
        default: ""
      extra-tfvars:
        description: >
          Flags `-var="chave=valor"` adicionais, uma por linha, para variáveis do
          main.tf do chamador que não são cobertas pelos inputs padrão (ex.:
          project_id/region/deployer_service_account para serviços fora do padrão
          Django dos cores, como o frontend-bjj). Repassado literalmente ao
          `terraform apply` — cada linha vira um argumento.
        type: string
        default: ""
    secrets:
      INFRA_MODULES_TOKEN:
        description: >
          PAT fine-grained (contents:read) com acesso ao repo cm-infra, usado só para o
          `terraform init` baixar os módulos via git HTTPS (github.token não alcança
          outro repo privado). Ver CMV-29. Alternativa: INFRA_MODULES_DEPLOY_KEY
          (chave SSH), para chamadores fora da org cm-tech-ventures que não herdam
          o secret de org. Pelo menos um dos dois é obrigatório.
        required: false
      INFRA_MODULES_DEPLOY_KEY:
        description: >
          Chave privada SSH (ed25519) de uma deploy key somente-leitura cadastrada
          em cm-tech-ventures/cm-infra, usada para o `terraform init` baixar os
          módulos quando o chamador não tem acesso ao PAT de org INFRA_MODULES_TOKEN
          (ex.: repos fora da org cm-tech-ventures, como sys-bjj-frontend — CMV-136).
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.terraform-dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.deploy-service-account }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      # cm-infra é público desde CMV-139: terraform init via HTTPS anônimo funciona
      # sem credenciais. Mantemos suporte a PAT (INFRA_MODULES_TOKEN) e deploy key
      # SSH (INFRA_MODULES_DEPLOY_KEY) para compatibilidade e para quando o repo
      # voltar a ser privado. Quando nenhuma credencial está presente, simplesmente
      # omitimos a configuração do git — o HTTPS anônimo resolve os módulos.
      # `secrets.*` não pode ser referenciado direto em `if:` de step (erro
      # "Unrecognized named-value: 'secrets'"). Detectamos aqui e usamos outputs.
      - name: Detectar credencial disponível para módulos do Terraform
        id: infra-modules-cred
        env:
          INFRA_MODULES_TOKEN: ${{ secrets.INFRA_MODULES_TOKEN }}
          INFRA_MODULES_DEPLOY_KEY: ${{ secrets.INFRA_MODULES_DEPLOY_KEY }}
        run: |
          echo "has-token=$([ -n "$INFRA_MODULES_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has-deploy-key=$([ -n "$INFRA_MODULES_DEPLOY_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Configure git para módulos privados do Terraform (PAT HTTPS)
        if: steps.infra-modules-cred.outputs.has-token == 'true'
        env:
          INFRA_MODULES_TOKEN: ${{ secrets.INFRA_MODULES_TOKEN }}
        run: |
          token="$(printf '%s' "$INFRA_MODULES_TOKEN" | tr -d '[:space:]')"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"

      - name: Configure git para módulos privados do Terraform (deploy key SSH)
        if: steps.infra-modules-cred.outputs.has-token == 'false' && steps.infra-modules-cred.outputs.has-deploy-key == 'true'
        env:
          INFRA_MODULES_DEPLOY_KEY: ${{ secrets.INFRA_MODULES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$INFRA_MODULES_DEPLOY_KEY" > ~/.ssh/infra_modules_key
          chmod 600 ~/.ssh/infra_modules_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/infra_modules_key
          {
            echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/infra_modules_key -o IdentitiesOnly=yes"
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Terraform init (backend GCS, state por serviço/ambiente)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ inputs.state-bucket }}" \
            -backend-config="prefix=${{ inputs.service }}/${{ inputs.environment }}"

      - name: Terraform apply
        env:
          EXTRA_TFVARS: ${{ inputs.extra-tfvars }}
        run: |
          extra_args=()
          while IFS= read -r line; do
            # eval para interpretar as aspas em -var="key=value" corretamente;
            # sem eval, as aspas ficam literais e corrompem os nomes das variáveis.
            [ -n "$line" ] && eval "extra_args+=($line)"
          done <<< "$EXTRA_TFVARS"

          terraform apply -input=false -auto-approve \
            -var="image=${{ inputs.image-uri }}" \
            -var="environment=${{ inputs.environment }}" \
            -var="service_name=${{ inputs.service }}" \
            -var="identity_introspection_url=${{ inputs.identity-introspection-url }}" \
            "${extra_args[@]}"

      - uses: google-github-actions/setup-gcloud@v2

      # Cria o schema Postgres do serviço (se necessário) e roda as migrations
      # via Cloud Run Job dedicado (não no processo web) — CMV-39. Idempotente:
      # seguro rodar em todo deploy. Roda logo após o `terraform apply` acima
      # ter publicado a nova revisão do Job com a imagem nova.
      #
      # Best-effort quanto ao output `release_job_name`: cores que ainda não
      # atualizaram seu infra/main.tf a partir do cm-service-template (ex.:
      # cm-identity, cm-crm — ver CMV-39) não têm esse output. Nesse caso
      # avisamos e seguimos sem quebrar o deploy, em vez de falhar duro.
      - name: Executar release job (schema + migrate)
        run: |
          job_name="$(terraform output -raw release_job_name 2>/dev/null || true)"
          if [ -z "$job_name" ]; then
            echo "::warning::Output 'release_job_name' não encontrado no infra/main.tf deste core — pulando release job (schema/migrate automático). Atualize infra/main.tf a partir do cm-service-template (CMV-39)."
            exit 0
          fi
          project_id="$(terraform output -raw project_id)"
          region="$(terraform output -raw region)"
          gcloud run jobs execute "${job_name}" \
            --project "${project_id}" \
            --region "${region}" \
            --wait

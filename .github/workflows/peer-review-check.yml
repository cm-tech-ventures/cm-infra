# Workflow chamador do próprio cm-infra (ADR-004). Usa o reutilizável local
# via `./` porque o reutilizável mora neste mesmo repo — não pode ter o
# mesmo nome de arquivo que `peer-review.yml`.
name: peer-review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  peer-review:
    uses: ./.github/workflows/peer-review.yml

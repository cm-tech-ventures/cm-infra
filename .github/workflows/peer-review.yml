# Reusable: gate de peer-review por status check (ADR-004, CMV-399/CMV-400/CMV-413).
#
# Fica vermelho quando o diff do PR toca path sensível e ainda não há o
# label `peer-reviewed`; verde caso contrário ou após o label ser aplicado
# (reavaliado automaticamente pelo evento `labeled`/`unlabeled`).
#
# Lista de paths sensíveis e matriz de pares: ver ADR-004
# (docs/adr/ADR-004-politica-revisao-diff.md, §2.2-2.4). Onde este workflow
# divergir do ADR, o ADR vence — atualize aqui para convergir.
#
# Resolução do revisor (CMV-413): o GitHub Actions não sabe qual agente
# autorou o PR (todos os agentes commitam sob a mesma conta `cadusds2` —
# ADR-004 §1.1). Por isso o autor deve aplicar o label `author:<Agente>`
# (ex.: `author:PlatformEngineer`) ao abrir o PR; o workflow lê esse label,
# resolve o par pela matriz do ADR-004 §2.2 e aplica o override do CTO
# (§2.3) quando o diff toca path de contrato/SDK. Sem o label `author:*`,
# a mensagem cai num fallback genérico pedindo para o autor identificar o
# par manualmente.
#
# Wake do revisor (CMV-413, decisão consciente registrada em ADR-004 §2.1):
# este workflow NÃO chama a API do Paperclip para acordar o revisor.
# Fazer isso exigiria plumbing de um secret de API do Paperclip
# compartilhado entre workflows/repos — decisão de infra/segurança que
# requer aprovação do board, fora do escopo deste fix. O mecanismo oficial
# é o fallback manual: o autor menciona o revisor resolvido abaixo na
# issue Paperclip com `[@Nome](agent://<id>)`.
#
# Uso no repo chamador (~10 linhas), em `.github/workflows/peer-review.yml`:
#
#   name: peer-review
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, labeled, unlabeled]
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     peer-review:
#       uses: cm-tech-ventures/cm-infra/.github/workflows/peer-review.yml@main
#       # extra-sensitive-paths (opcional): estende a lista default, nunca reduz.
#       # with:
#       #   extra-sensitive-paths: |
#       #     **/billing/**
name: peer-review

on:
  workflow_call:
    inputs:
      extra-sensitive-paths:
        description: >
          Paths sensíveis adicionais (um glob por linha), somados à lista
          default. Nunca usado para reduzir a lista default (ADR-004).
        type: string
        default: ""
      label:
        description: Label que marca o PR como já revisado pelo par.
        type: string
        default: "peer-reviewed"

jobs:
  peer-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # CMV-639 (regressão de CMV-561): pedir `issues: read` aqui derruba o
      # job com `startup_failure` sempre que um caller não foi atualizado
      # para conceder essa permissão — e a propagação manual pra cada repo
      # nunca alcança 100% (6 de 8 repos ficaram pra trás). Em vez de exigir
      # o escopo `issues`, lemos os labels via `pulls/{n}` (que já os inclui
      # no payload) — isso cabe no escopo `pull-requests` que todo caller já
      # concede, eliminando a dependência de propagação entre repos.
    steps:
      - name: Avalia paths sensíveis x label de revisão
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXTRA_PATHS: ${{ inputs.extra-sensitive-paths }}
          REVIEW_LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail

          # Paths sensíveis default (ADR-004 §2.4) — cada repo pode estender
          # via extra-sensitive-paths, nunca reduzir sem novo ADR.
          DEFAULT_PATTERNS='
          **/schema.yml
          **/openapi*.yml
          docs/api/**
          **/migrations/**
          service/**
          .github/workflows/**
          infra/**
          cm-sdk/**
          config/settings*
          **/AGENTS.md
          docs/adr/**
          '

          PATTERNS="$(printf '%s\n%s\n' "$DEFAULT_PATTERNS" "$EXTRA_PATHS" | sed '/^\s*$/d')"

          CHANGED_FILES="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"

          echo "Arquivos alterados no PR:"
          echo "$CHANGED_FILES"
          echo
          echo "Paths sensíveis avaliados:"
          echo "$PATTERNS"

          TOUCHED_SENSITIVE=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              # O `case` do shell não trata `**` como globstar recursivo: um
              # padrão `**/algo` exige literalmente um `/` antes de "algo" e
              # não casa arquivos na raiz do repo (CMV-410). Para padrões
              # prefixados com `**/`, testamos também a variante sem o
              # prefixo, cobrindo o caso de raiz.
              root_variant="$pattern"
              case "$pattern" in
                '**/'*)
                  root_variant="${pattern#\*\*/}"
                  ;;
              esac
              case "$file" in
                $pattern|$root_variant)
                  TOUCHED_SENSITIVE="$file (casou com '$pattern')"
                  ;;
              esac
              [ -n "$TOUCHED_SENSITIVE" ] && break
            done <<< "$PATTERNS"
            [ -n "$TOUCHED_SENSITIVE" ] && break
          done <<< "$CHANGED_FILES"

          if [ -z "$TOUCHED_SENSITIVE" ]; then
            echo "::notice::Diff não toca path sensível — check verde."
            exit 0
          fi

          echo "Path sensível tocado: $TOUCHED_SENSITIVE"

          # Lido via pulls/{n} (não issues/{n}/labels) — ver comentário na
          # seção `permissions` acima (CMV-639).
          LABELS="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.labels[].name')"

          if echo "$LABELS" | grep -Fxq "$REVIEW_LABEL"; then
            echo "::notice::Diff toca path sensível, mas já tem o label '${REVIEW_LABEL}' — check verde."
            exit 0
          fi

          # Resolve o revisor par (ADR-004 §2.2-2.3, CMV-413). Sem a
          # identidade do autor (label author:<Agente>) não dá pra aplicar
          # a matriz — cai no fallback genérico.
          AUTHOR="$(echo "$LABELS" | sed -n 's/^author:\(.*\)$/\1/p' | head -n1)"

          # Override do CTO (§2.3): contrato OpenAPI, docs/api e cm-sdk
          # sempre vão para o CTO, independentemente da matriz de pares.
          CTO_OVERRIDE=no
          while IFS= read -r f; do
            case "$f" in
              *schema.yml|*openapi*.yml|docs/api/*|cm-sdk/*) CTO_OVERRIDE=yes ;;
            esac
          done <<< "$CHANGED_FILES"

          # Matriz de pares (ADR-004 §2.2) — nome -> agent id (Paperclip).
          resolve_reviewer() {
            case "$1" in
              BackendCore) echo "IntegrationsEngineer 8f9026cd-ab66-4ca0-a6f7-1ca6bb000de8" ;;
              IntegrationsEngineer) echo "BackendCore 710887d8-2631-4246-aa83-e8fb6db4d8e7" ;;
              VerticalMD) echo "VerticalBJJ d7c47ceb-39ce-4b87-a07b-aaf153a491d4" ;;
              VerticalBJJ) echo "VerticalMD bdfda58a-8693-4e25-96cd-c9378c0b105b" ;;
              DataEngineer) echo "BackendCore 710887d8-2631-4246-aa83-e8fb6db4d8e7" ;;
              PlatformEngineer) echo "CTO a892a163-cc2b-4ade-a761-7117501c3b48" ;;
              CTO) echo "PlatformEngineer 7e1e257b-012c-4865-b41c-4b36ebd776ca" ;;
              CEO) echo "CTO a892a163-cc2b-4ade-a761-7117501c3b48" ;;
              *) echo "" ;;
            esac
          }

          if [ "$CTO_OVERRIDE" = "yes" ]; then
            REVIEWER="CTO a892a163-cc2b-4ade-a761-7117501c3b48"
          elif [ -n "$AUTHOR" ]; then
            REVIEWER="$(resolve_reviewer "$AUTHOR")"
          else
            REVIEWER=""
          fi

          if [ -n "$REVIEWER" ]; then
            REVIEWER_NAME="$(echo "$REVIEWER" | cut -d' ' -f1)"
            REVIEWER_ID="$(echo "$REVIEWER" | cut -d' ' -f2)"
            echo "::error::Diff toca path sensível ($TOUCHED_SENSITIVE) e o PR ainda não tem o label '${REVIEW_LABEL}'. Revisor par (ADR-004): ${REVIEWER_NAME}. Faça handoff via menção estruturada [@${REVIEWER_NAME}](agent://${REVIEWER_ID}) na issue Paperclip; o par roda /code-review, comenta os achados no PR e aplica o label. O check reavalia sozinho no evento 'labeled'."
          else
            echo "::error::Diff toca path sensível ($TOUCHED_SENSITIVE) e o PR ainda não tem o label '${REVIEW_LABEL}'. Não foi possível resolver o revisor par automaticamente: aplique o label 'author:<SeuAgente>' neste PR para o check indicar o par exato (ADR-004 §2.2), ou identifique-o manualmente e faça handoff via [@Par](agent://<id>) na issue Paperclip. O check reavalia sozinho no evento 'labeled'."
          fi
          exit 1

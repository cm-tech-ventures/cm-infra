# RETRATO, NÃO FONTE: ninguém edita este arquivo à mão — quem edita, edita no Backoffice.
#
# Por que ele existe: o banco do Backoffice está no Supabase do plano gratuito e
# NÃO TEM BACKUP (risco assumido em 24/09/2026). Sem este retrato, se o banco
# morrer perde-se o que rodava, quando, apontando para onde e com qual
# autenticação — e "recriar o ambiente a partir do código" deixa de funcionar.
#
# A distinção que não pode se perder: o desenho de 1º/10/2026 descartou o
# catálogo YAML como fonte e o gerador de Terraform a partir do banco,
# justamente para a empresa ter UM dono de cada coisa. Se alguém começar a
# editar este arquivo, o projeto volta a ter duas verdades. Nenhum `.tf` lê
# este arquivo, e ele mora fora de `environments/` de propósito — ao contrário
# de `environments/alertas-*/alertas.yaml`, que é fonte de verdade e é lido
# pelo `main.tf` ao lado.
#
# Quem é dono de quê: o Google é dono de horário, estado e última tentativa; o
# Backoffice é dono do enriquecimento (nome em português, dono, etiqueta) e do
# registro de ação humana. Este arquivo é cópia dos dois, com data.
#
# Medido em: 06/10/2026
# Medido por: `gcloud scheduler jobs list --location=southamerica-east1` nas duas
#   contas — `cm.tech.ventures@gmail.com` (projeto cm-ventures-core) e
#   `bjjsystem25@gmail.com` (projeto bjj-system). O bjj-system NÃO é visível
#   pela conta do core: trocar de conta antes de concluir que não há acesso.
# Varridas também us-central1, us-east1 e europe-west1: vazias.
#
# SÃO 7 AGENDAMENTOS, não os 13 do plano de 02/10. As 6 rotinas de BI foram
# removidas pelos PRs #72/#73 do `cm-analytics` ("E2: remove o analytics
# antigo"), já aplicados, e a `analytics-diario` que as substitui ainda não
# existe. O 13º era a `keepalive-check-hom`, criada em 02/10 e presente aqui.
# Isto é observação, não conserto: se o número voltar a 13, este retrato muda.
#
# campos:
#   nome_job       id do agendamento no Cloud Scheduler
#   nome_pt        como o Backoffice chama a rotina na tela
#   projeto        projeto GCP; `conta` diz por qual conta gcloud ele é visível
#   regiao         location do Cloud Scheduler
#   cron / fuso    horário como o Google guarda
#   estado         ENABLED | PAUSED, no momento da medição
#   tipo_alvo      http_oidc           = POST direto no serviço, token OIDC
#                  cloud_run_job_oauth = POST na Run Admin API (`:run`), token OAuth
#   destino        A URL COMPLETA. Nunca montar por convenção: o sys-bjj usa
#                  `/internal/tarefas/` em português e os cores usam
#                  `/internal/tasks/`. A URL é dado.
#   autenticacao   conta de serviço do disparo e, no OIDC, o audience
#   retry          `retryCount` de hoje. A onda 4 padroniza retry zero para
#                  rotina nova; estas são as de antes desse padrão.
#   prazo          attemptDeadline
#   etiqueta       consequência de pausar, como o Backoffice classifica
#   terraform      onde o bloco ainda é declarado. Some conforme a onda 5
#                  migra cada rotina para o Backoffice.

